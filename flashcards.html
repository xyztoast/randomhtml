<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>
<style>
    :root {
        --bg: #090909;
        --panel: #101010;
        --panel-2: #151515;
        --border: #252525;
        --text: #f5f5f5;
        --muted: #8d8d8d;
        --accent: #ffffff;
        --danger: #ff5f5f;
        --shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
        overflow: hidden;
    }

    button, textarea, input {
        font: inherit;
    }

    button {
        border: 0;
    }

    .app {
        min-height: 100vh;
        display: flex;
    }

    .sidebar {
        width: 58px;
        flex: 0 0 58px;
        border-right: 1px solid var(--border);
        background: #0b0b0b;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 0;
        z-index: 30;
    }

    .brand {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        color: #0b0b0b;
        background: #fff;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: -.06em;
        user-select: none;
        margin-bottom: 14px;
    }

    .sidebar-spacer {
        flex: 1;
    }

    .icon-btn {
        width: 36px;
        height: 36px;
        margin: 4px 0;
        border-radius: 10px;
        background: transparent;
        color: #8c8c8c;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: .18s ease;
        position: relative;
    }

    .icon-btn:hover {
        background: #171717;
        color: #fff;
    }

    .icon-btn.active {
        background: #fff;
        color: #0b0b0b;
    }

    .icon-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .main {
        flex: 1;
        min-width: 0;
        position: relative;
        height: 100vh;
    }

    .view {
        height: 100%;
        width: 100%;
    }

    .study-view {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 42px 28px 28px;
    }

    .study-top {
        width: min(100%, 900px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
    }

    .eyebrow {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    .progress {
        color: #bdbdbd;
        font-size: 14px;
    }

    .study-stage {
        width: min(100%, 900px);
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 0;
    }

    .card-scene {
        width: min(780px, 92vw);
        height: min(500px, 66vh);
        perspective: 1800px;
        position: relative;
    }

    .card-scene.animating-out-left .card,
    .card-scene.animating-in-left .card,
    .card-scene.animating-out-right .card,
    .card-scene.animating-in-right .card {
        animation-duration: .28s;
        animation-timing-function: cubic-bezier(.2, .8, .2, 1);
        animation-fill-mode: both;
    }

    .card-scene.animating-out-left .card { animation-name: outLeft; }
    .card-scene.animating-in-left .card { animation-name: inRight; }
    .card-scene.animating-out-right .card { animation-name: outRight; }
    .card-scene.animating-in-right .card { animation-name: inLeft; }

    @keyframes outLeft {
        from { transform: translateX(0) rotateZ(0deg); opacity: 1; }
        to { transform: translateX(-120%) rotateZ(-5deg); opacity: 0; }
    }

    @keyframes outRight {
        from { transform: translateX(0) rotateZ(0deg); opacity: 1; }
        to { transform: translateX(120%) rotateZ(5deg); opacity: 0; }
    }

    @keyframes inLeft {
        from { transform: translateX(-120%) rotateZ(-5deg); opacity: 0; }
        to { transform: translateX(0) rotateZ(0deg); opacity: 1; }
    }

    @keyframes inRight {
        from { transform: translateX(120%) rotateZ(5deg); opacity: 0; }
        to { transform: translateX(0) rotateZ(0deg); opacity: 1; }
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        cursor: pointer;
        transition: transform .65s cubic-bezier(.2, .72, .2, 1);
        outline: none;
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .card-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        border: 1px solid #e6e6e6;
        border-radius: 24px;
        background: #fff;
        color: #101010;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 50px;
        box-shadow: var(--shadow);
        overflow: hidden;
    }

    .card-face::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 15% 10%, rgba(0,0,0,.035), transparent 35%),
            radial-gradient(circle at 85% 90%, rgba(0,0,0,.03), transparent 30%);
        pointer-events: none;
    }

    .card-back {
        transform: rotateY(180deg);
        background: #f5f5f5;
    }

    .card-label {
        color: #878787;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .14em;
        text-transform: uppercase;
        position: absolute;
        top: 28px;
        left: 32px;
    }

    .card-text {
        width: min(100%, 680px);
        font-size: clamp(25px, 4vw, 45px);
        line-height: 1.12;
        font-weight: 700;
        letter-spacing: -.035em;
        text-align: center;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        position: relative;
        z-index: 1;
        max-height: 75%;
        overflow: auto;
        scrollbar-width: thin;
    }

    .card-hint {
        position: absolute;
        bottom: 24px;
        left: 0;
        right: 0;
        text-align: center;
        color: #929292;
        font-size: 13px;
        z-index: 1;
        user-select: none;
    }

    .controls {
        width: min(100%, 900px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding-top: 8px;
    }

    .nav-btn {
        height: 46px;
        min-width: 110px;
        padding: 0 18px;
        border: 1px solid var(--border);
        background: #111;
        color: #eee;
        border-radius: 12px;
        cursor: pointer;
        transition: .18s ease;
        font-weight: 650;
    }

    .nav-btn:hover:not(:disabled) {
        background: #181818;
        border-color: #363636;
        transform: translateY(-1px);
    }

    .nav-btn:disabled {
        opacity: .35;
        cursor: not-allowed;
    }

    .flip-btn {
        height: 46px;
        min-width: 120px;
        padding: 0 20px;
        border-radius: 12px;
        background: #fff;
        color: #090909;
        cursor: pointer;
        font-weight: 750;
        transition: .18s ease;
    }

    .flip-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 28px rgba(255,255,255,.10);
    }

    .empty-state {
        width: min(580px, 90vw);
        text-align: center;
        padding: 42px;
        border: 1px dashed #2d2d2d;
        border-radius: 20px;
        background: rgba(255,255,255,.02);
    }

    .empty-state h2 {
        margin: 0 0 10px;
        font-size: 25px;
    }

    .empty-state p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.55;
    }

    /* editor */
    .editor-view {
        display: none;
        padding: 28px;
    }

    .editor-layout {
        display: flex;
        gap: 20px;
        height: 100%;
        min-height: 0;
    }

    .editor-list,
    .editor-panel {
        border: 1px solid var(--border);
        background: #0e0e0e;
        border-radius: 18px;
    }

    .editor-list {
        width: 320px;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .editor-list-top {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .editor-title {
        font-size: 15px;
        font-weight: 750;
    }

    .add-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: #fff;
        color: #0b0b0b;
        cursor: pointer;
        font-size: 21px;
        line-height: 1;
    }

    .card-list {
        overflow-y: auto;
        padding: 8px;
        scrollbar-width: thin;
    }

    .card-list-item {
        width: 100%;
        text-align: left;
        padding: 13px 14px;
        margin-bottom: 5px;
        border-radius: 11px;
        background: transparent;
        color: #d8d8d8;
        cursor: pointer;
        border: 1px solid transparent;
    }

    .card-list-item:hover {
        background: #161616;
    }

    .card-list-item.active {
        background: #181818;
        border-color: #303030;
        color: #fff;
    }

    .card-list-number {
        display: block;
        color: #6f6f6f;
        font-size: 11px;
        margin-bottom: 5px;
    }

    .card-list-text {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        font-size: 14px;
        line-height: 1.4;
    }

    .editor-panel {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .editor-panel-top {
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .editor-panel-top strong {
        font-size: 15px;
    }

    .delete-btn {
        border: 1px solid #392020;
        background: #171010;
        color: #ff8585;
        padding: 9px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
    }

    .delete-btn:hover {
        background: #211313;
    }

    .fields {
        padding: 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 9px;
    }

    .field label {
        color: #b9b9b9;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    .field textarea {
        width: 100%;
        min-height: 170px;
        resize: vertical;
        padding: 15px 16px;
        border-radius: 13px;
        border: 1px solid #282828;
        background: #111;
        color: #f4f4f4;
        outline: none;
        line-height: 1.5;
        transition: .18s ease;
    }

    .field textarea:focus {
        border-color: #545454;
        box-shadow: 0 0 0 3px rgba(255,255,255,.04);
    }

    .save-note {
        color: #696969;
        font-size: 12px;
    }

    @media (max-width: 800px) {
        .study-view {
            padding: 24px 16px 20px;
        }

        .card-scene {
            width: min(94vw, 720px);
            height: min(460px, 62vh);
        }

        .card-face {
            padding: 36px 24px;
            border-radius: 20px;
        }

        .editor-view {
            padding: 14px;
        }

        .editor-layout {
            flex-direction: column;
        }

        .editor-list {
            width: 100%;
            height: 34%;
            min-height: 180px;
        }

        .editor-panel {
            flex: 1;
        }
    }

    @media (max-width: 520px) {
        .sidebar {
            width: 50px;
            flex-basis: 50px;
        }

        .brand, .icon-btn {
            width: 32px;
            height: 32px;
        }

        .card-scene {
            height: 52vh;
        }

        .card-text {
            font-size: clamp(23px, 8vw, 34px);
        }

        .controls {
            gap: 7px;
        }

        .nav-btn, .flip-btn {
            min-width: 0;
            flex: 1;
            padding: 0 10px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .card, .icon-btn, .nav-btn, .flip-btn {
            transition: none !important;
        }

        .card-scene.animating-out-left .card,
        .card-scene.animating-in-left .card,
        .card-scene.animating-out-right .card,
        .card-scene.animating-in-right .card {
            animation: none !important;
        }
    }
</style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">fc</div>

        <button class="icon-btn active" id="studyBtn" title="study mode" aria-label="study mode">
            <svg viewBox="0 0 24 24">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"></path>
                <path d="M4 5.5v16"></path>
            </svg>
        </button>

        <button class="icon-btn" id="editBtn" title="editing mode" aria-label="editing mode">
            <svg viewBox="0 0 24 24">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4z"></path>
            </svg>
        </button>

        <div class="sidebar-spacer"></div>

        <button class="icon-btn" id="importBtn" title="import json" aria-label="import json">
            <svg viewBox="0 0 24 24">
                <path d="M12 15V3"></path>
                <path d="M8 7l4 4 4-4"></path>
                <path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"></path>
            </svg>
        </button>

        <button class="icon-btn" id="exportBtn" title="export as json" aria-label="export as json">
            <svg viewBox="0 0 24 24">
                <path d="M12 3v12"></path>
                <path d="M8 7l4-4 4 4"></path>
                <path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"></path>
            </svg>
        </button>

        <button class="icon-btn" id="resetBtn" title="reset cards" aria-label="reset cards">
            <svg viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path>
                <path d="M3 21v-5h5"></path>
            </svg>
        </button>
    </aside>

    <main class="main">
        <section class="view study-view" id="studyView">
            <div class="study-top">
                <div class="eyebrow">flashcards</div>
                <div class="progress" id="progress">0 / 0</div>
            </div>

            <div class="study-stage" id="studyStage"></div>

            <div class="controls">
                <button class="nav-btn" id="prevBtn">previous</button>
                <button class="flip-btn" id="flipBtn">flip card</button>
                <button class="nav-btn" id="nextBtn">next</button>
            </div>
        </section>

        <section class="view editor-view" id="editorView">
            <div class="editor-layout">
                <div class="editor-list">
                    <div class="editor-list-top">
                        <div class="editor-title">your cards</div>
                        <button class="add-btn" id="addBtn" title="add flashcard" aria-label="add flashcard">+</button>
                    </div>
                    <div class="card-list" id="cardList"></div>
                </div>

                <div class="editor-panel" id="editorPanel">
                    <div class="editor-panel-top">
                        <strong id="editorCardTitle">select a card</strong>
                        <button class="delete-btn" id="deleteBtn">delete card</button>
                    </div>

                    <div class="fields">
                        <div class="field">
                            <label for="frontInput">front</label>
                            <textarea id="frontInput" placeholder="write the question or prompt..."></textarea>
                        </div>

                        <div class="field">
                            <label for="backInput">back</label>
                            <textarea id="backInput" placeholder="write the answer..."></textarea>
                        </div>

                        <div class="save-note">changes save automatically to this browser</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(() => {
    const STORAGE_KEY = "flashcards_app_v1";

    const defaultCards = [
        {
            front: "what is the capital of france?",
            back: "paris"
        },
        {
            front: "what does html stand for?",
            back: "hypertext markup language"
        },
        {
            front: "what does css stand for?",
            back: "cascading style sheets"
        }
    ];

    let cards = loadCards();
    let studyOrder = [];
    let currentIndex = 0;
    let selectedIndex = 0;
    let currentView = "study";
    let isFlipped = false;
    let isTransitioning = false;

    function shuffleArray(length) {
        const array = Array.from({ length }, (_, index) => index);

        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }

        return array;
    }

    function startStudySession() {
        studyOrder = shuffleArray(cards.length);
        currentIndex = 0;
        isFlipped = false;
    }

    function getCurrentStudyCard() {
        if (!studyOrder.length) return null;
        const sourceIndex = studyOrder[currentIndex];
        return cards[sourceIndex] ?? null;
    }

    const studyView = document.getElementById("studyView");
    const editorView = document.getElementById("editorView");
    const studyBtn = document.getElementById("studyBtn");
    const editBtn = document.getElementById("editBtn");
    const resetBtn = document.getElementById("resetBtn");
    const exportBtn = document.getElementById("exportBtn");
    const importBtn = document.getElementById("importBtn");
    const importFile = document.getElementById("importFile");

    const progress = document.getElementById("progress");
    const studyStage = document.getElementById("studyStage");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const flipBtn = document.getElementById("flipBtn");

    const cardList = document.getElementById("cardList");
    const addBtn = document.getElementById("addBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const editorCardTitle = document.getElementById("editorCardTitle");
    const frontInput = document.getElementById("frontInput");
    const backInput = document.getElementById("backInput");

    function loadCards() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return structuredClone(defaultCards);
            const parsed = JSON.parse(saved);
            if (!Array.isArray(parsed)) return structuredClone(defaultCards);

            return parsed
                .filter(card => card && typeof card.front === "string" && typeof card.back === "string")
                .map(card => ({
                    front: card.front,
                    back: card.back
                }));
        } catch {
            return structuredClone(defaultCards);
        }
    }

    function saveCards() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }

    function renderStudy() {
        progress.textContent = studyOrder.length ? `${currentIndex + 1} / ${studyOrder.length}` : "0 / 0";

        prevBtn.disabled = studyOrder.length < 2 || currentIndex <= 0;
        nextBtn.disabled = studyOrder.length < 2 || currentIndex >= studyOrder.length - 1;
        flipBtn.disabled = cards.length === 0;

        if (!cards.length) {
            studyStage.innerHTML = `
                <div class="empty-state">
                    <h2>no flashcards yet</h2>
                    <p>make your first card in editing mode. your browser will save it automatically.</p>
                    <button class="flip-btn" id="emptyEditBtn">open editor</button>
                </div>
            `;
            document.getElementById("emptyEditBtn").addEventListener("click", () => switchView("edit"));
            return;
        }

        const card = getCurrentStudyCard();

        studyStage.innerHTML = `
            <div class="card-scene" id="cardScene">
                <div class="card ${isFlipped ? "flipped" : ""}" id="flashcard" tabindex="0" role="button" aria-label="flashcard, click or press space to flip">
                    <div class="card-face card-front">
                        <div class="card-label">question</div>
                        <div class="card-text"></div>
                        <div class="card-hint">click or press space to flip</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-label">answer</div>
                        <div class="card-text"></div>
                        <div class="card-hint">click or press space to flip back</div>
                    </div>
                </div>
            </div>
        `;

        const cardEl = document.getElementById("flashcard");
        const texts = cardEl.querySelectorAll(".card-text");
        texts[0].textContent = card.front;
        texts[1].textContent = card.back;

        cardEl.addEventListener("click", flipCard);
        cardEl.addEventListener("keydown", (event) => {
            if (event.code === "Space" || event.code === "Enter") {
                event.preventDefault();
                flipCard();
            }
        });
    }

    function renderEditor() {
        cardList.innerHTML = "";

        if (!cards.length) {
            editorCardTitle.textContent = "no cards";
            frontInput.value = "";
            backInput.value = "";
            frontInput.disabled = true;
            backInput.disabled = true;
            deleteBtn.disabled = true;
            return;
        }

        frontInput.disabled = false;
        backInput.disabled = false;
        deleteBtn.disabled = false;

        cards.forEach((card, index) => {
            const item = document.createElement("button");
            item.className = `card-list-item ${index === selectedIndex ? "active" : ""}`;

            const number = document.createElement("span");
            number.className = "card-list-number";
            number.textContent = `card ${index + 1}`;

            const text = document.createElement("span");
            text.className = "card-list-text";
            text.textContent = card.front || "(empty front)";

            item.append(number, text);
            item.addEventListener("click", () => selectCard(index));
            cardList.appendChild(item);
        });

        editorCardTitle.textContent = `card ${selectedIndex + 1}`;
        frontInput.value = cards[selectedIndex]?.front ?? "";
        backInput.value = cards[selectedIndex]?.back ?? "";
    }

    function selectCard(index) {
        if (!cards[index]) return;
        selectedIndex = index;
        renderEditor();
    }

    function switchView(view) {
        currentView = view;

        if (view === "study") {
            startStudySession();
            studyView.style.display = "flex";
            editorView.style.display = "none";
            studyBtn.classList.add("active");
            editBtn.classList.remove("active");
            renderStudy();
        } else {
            studyView.style.display = "none";
            editorView.style.display = "block";
            studyBtn.classList.remove("active");
            editBtn.classList.add("active");
            renderEditor();
        }
    }

    function flipCard() {
        if (isTransitioning || !cards.length) return;

        const cardEl = document.getElementById("flashcard");
        if (!cardEl) return;

        isFlipped = !isFlipped;
        cardEl.classList.toggle("flipped", isFlipped);
    }

    function moveCard(direction) {
        if (isTransitioning || cards.length < 2) return;

        const nextIndex = currentIndex + direction;
        if (nextIndex < 0 || nextIndex >= studyOrder.length) return;

        const scene = document.getElementById("cardScene");
        if (!scene) return;

        isTransitioning = true;
        const exitClass = direction > 0 ? "animating-out-left" : "animating-out-right";
        const enterClass = direction > 0 ? "animating-in-right" : "animating-in-left";

        scene.classList.add(exitClass);

        setTimeout(() => {
            currentIndex = nextIndex;
            isFlipped = false;
            renderStudy();

            const newScene = document.getElementById("cardScene");
            newScene.classList.add(enterClass);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    newScene.classList.remove(enterClass);
                });
            });

            setTimeout(() => {
                isTransitioning = false;
            }, 290);
        }, 280);
    }

    function addCard() {
        cards.push({
            front: "",
            back: ""
        });

        selectedIndex = cards.length - 1;
        saveCards();
        startStudySession();
        renderEditor();

        setTimeout(() => frontInput.focus(), 0);
    }

    function deleteCard() {
        if (!cards.length || !cards[selectedIndex]) return;

        cards.splice(selectedIndex, 1);

        if (selectedIndex >= cards.length) {
            selectedIndex = Math.max(0, cards.length - 1);
        }

        isFlipped = false;
        saveCards();
        startStudySession();
        renderEditor();
        renderStudy();
    }

    function importJSON(file) {
        if (!file) return;

        const reader = new FileReader();

        reader.onload = () => {
            try {
                const parsed = JSON.parse(reader.result);
                const importedCards = Array.isArray(parsed)
                    ? parsed
                    : parsed && Array.isArray(parsed.cards)
                        ? parsed.cards
                        : null;

                if (!importedCards) throw new Error("invalid format");

                const cleanedCards = importedCards
                    .filter(card => card && typeof card.front === "string" && typeof card.back === "string")
                    .map(card => ({ front: card.front, back: card.back }));

                if (!cleanedCards.length) throw new Error("no valid cards");

                cards = cleanedCards;
                selectedIndex = 0;
                saveCards();
                startStudySession();
                renderEditor();
                renderStudy();
                alert(`imported ${cards.length} flashcard${cards.length === 1 ? "" : "s"} successfully.`);
            } catch {
                alert("could not import that file. make sure it is a valid flashcard json file.");
            } finally {
                importFile.value = "";
            }
        };

        reader.onerror = () => {
            alert("could not read that file.");
            importFile.value = "";
        };

        reader.readAsText(file);
    }

    function exportJSON() {
        const payload = {
            name: "my flashcards",
            version: 1,
            cards: cards.map(card => ({
                front: card.front,
                back: card.back
            }))
        };

        const blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: "application/json"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const date = new Date().toISOString().slice(0, 10);

        link.href = url;
        link.download = `flashcards-${date}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
    }

    function updateCurrentCard() {
        if (!cards[selectedIndex]) return;
        cards[selectedIndex].front = frontInput.value;
        cards[selectedIndex].back = backInput.value;

        const listItem = cardList.children[selectedIndex];
        if (listItem) {
            const text = listItem.querySelector(".card-list-text");
            if (text) text.textContent = frontInput.value || "(empty front)";
        }

        saveCards();
    }

    importBtn.addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", () => importJSON(importFile.files[0]));
    exportBtn.addEventListener("click", exportJSON);

    studyBtn.addEventListener("click", () => switchView("study"));
    editBtn.addEventListener("click", () => switchView("edit"));

    prevBtn.addEventListener("click", () => moveCard(-1));
    nextBtn.addEventListener("click", () => moveCard(1));
    flipBtn.addEventListener("click", flipCard);

    addBtn.addEventListener("click", addCard);
    deleteBtn.addEventListener("click", deleteCard);

    frontInput.addEventListener("input", updateCurrentCard);
    backInput.addEventListener("input", updateCurrentCard);

    resetBtn.addEventListener("click", () => {
        const confirmed = confirm("reset all flashcards to the starter set?");
        if (!confirmed) return;

        cards = structuredClone(defaultCards);
        currentIndex = 0;
        selectedIndex = 0;
        saveCards();
        startStudySession();

        if (currentView === "edit") {
            renderEditor();
        } else {
            renderStudy();
        }
    });

    document.addEventListener("keydown", (event) => {
        const tag = document.activeElement?.tagName?.toLowerCase();
        const isTyping = tag === "textarea" || tag === "input";

        if (currentView !== "study" || isTyping) return;

        if (event.code === "ArrowRight") {
            event.preventDefault();
            moveCard(1);
        }

        if (event.code === "ArrowLeft") {
            event.preventDefault();
            moveCard(-1);
        }

        if (event.code === "Space") {
            event.preventDefault();
            flipCard();
        }
    });

    startStudySession();
    renderStudy();
    renderEditor();
})();
</script>
</body>
</html>
